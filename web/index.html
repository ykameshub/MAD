<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Package Booking</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1{
            text-align:center;
            color:#fff;
            font-size:38px;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            color:white;
            margin-bottom:25px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline:none;
            border:2px solid #00d4ff;
        }
    </style>

</head>

<body>

<div class="overlay">

<div class="container">

<h1>✈ ULLASA PAYANAM</h1>

<p class="subtitle">
Book now for enjoy the kujala.
</p>

<form id="travelForm">

<div class="row">

<div class="inputBox">
<label>Full Name</label>
<input
type="text"
id="name"
placeholder="Enter your full name">
</div>

<div class="inputBox">
<label>Email</label>
<input
type="email"
id="email"
placeholder="Enter your email">
</div>

</div>

<div class="row">

<div class="inputBox">
<label>Mobile Number</label>
<input
type="text"
id="phone"
placeholder="10-digit mobile number">
</div>

<div class="inputBox">
<label>Destination</label>

<select id="destination">
<option value="">Select Destination</option>
<option>Bali</option>
<option>Maldives</option>
<option>Dubai</option>
<option>Singapore</option>
<option>Switzerland</option>
<option>Paris</option>
<option>Japan</option>
<option>Goa</option>
</select>

</div>

</div>

<div class="row">

<div class="inputBox">
<label>Departure Date</label>
<input
type="date"
id="departure">
</div>

<div class="inputBox">
<label>Return Date</label>
<input
type="date"
id="return">
</div>

</div>

<div class="row">

<div class="inputBox">
<label>Number of Travelers</label>
<input
type="number"
id="travellers"
min="1"
placeholder="Number of travelers">
</div>

<div class="inputBox">
<label>Package Type</label>

<select id="package">
<option value="">Choose Package</option>
<option>Standard</option>
<option>Premium</option>
<option>Luxury</option>
</select>

</div>

</div>

<div class="row">

<div class="inputBox">
<label>Passport Upload</label>
<input
type="file"
id="passport"
accept=".pdf,.jpg,.png">
</div>

<div class="inputBox">
<label>Special Requests</label>
<textarea
id="message"
rows="4"
placeholder="Food preference, hotel, etc."></textarea>
</div>

</div>

<div class="center">

<!-- Inline CSS -->
<button
type="submit"
style="
background:#ff9800;
color:white;
padding:15px 45px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
font-weight:bold;">
Book My Trip ✈
</button>

</div>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
